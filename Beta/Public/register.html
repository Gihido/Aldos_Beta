<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание героя</title>
    <style>
        :root{
            --bg:#f5f2eb;
            --panel:#fffaf2;
            --panel2:#f7efe2;
            --line:#d8cbbc;
            --text:#3b3128;
            --muted:#7a6b5f;
            --accent:#d9863b;
            --accent-dark:#b96b28;
            --shadow:0 12px 30px rgba(92,67,43,.1);
            --r:22px;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            min-height:100vh;
            font-family:Arial,sans-serif;
            color:var(--text);
            background:
                radial-gradient(circle at top left, rgba(217,134,59,.08), transparent 24%),
                radial-gradient(circle at bottom right, rgba(120,120,120,.06), transparent 28%),
                linear-gradient(180deg, #f8f5ef 0%, #f1ece4 100%);
            display:grid;
            place-items:center;
            padding:20px;
        }
        .card{
            width:min(100%, 760px);
            background:linear-gradient(180deg,var(--panel),var(--panel2));
            border:1px solid var(--line);
            box-shadow:var(--shadow);
            border-radius:28px;
            padding:28px;
        }
        .title{
            text-align:center;
            margin:0 0 8px;
            font-size:36px;
        }
        .sub{
            text-align:center;
            color:var(--muted);
            margin-bottom:22px;
        }
        .input{
            width:100%;
            padding:15px 16px;
            border-radius:14px;
            border:1px solid var(--line);
            background:#fff;
            font-size:16px;
            margin-bottom:12px;
        }
        .class-grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:14px;
            margin:18px 0;
        }
        .class-card{
            background:#fff;
            border:2px solid var(--line);
            border-radius:18px;
            padding:16px;
            cursor:pointer;
            transition:.2s ease;
        }
        .class-card:hover{transform:translateY(-2px)}
        .class-card.active{
            border-color:var(--accent);
            background:#fff3e6;
        }
        .class-title{
            font-size:20px;
            font-weight:700;
            margin-bottom:10px;
        }
        .class-desc{
            color:var(--muted);
            line-height:1.55;
            font-size:14px;
        }
        .btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:14px;
            cursor:pointer;
            font-weight:700;
            font-size:16px;
            color:#fff;
            background:linear-gradient(135deg,var(--accent),var(--accent-dark));
        }
        .msg{
            text-align:center;
            color:var(--muted);
            margin-top:12px;
        }
        .msg a{
            color:var(--accent-dark);
            text-decoration:none;
            font-weight:700;
        }
        @media (max-width:760px){
            .class-grid{grid-template-columns:1fr}
            .title{font-size:28px}
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="title">Создание героя</h1>
        <div class="sub">Выбери класс и создай персонажа</div>

        <input class="input" id="username" type="text" placeholder="Логин">
        <input class="input" id="password" type="password" placeholder="Пароль">

        <div class="class-grid">
            <div class="class-card active" onclick="selectClass('archer', this)">
                <div class="class-title">Лучник</div>
                <div class="class-desc">
                    85 HP<br>
                    Урон 5–10<br>
                    10% шанс двойного урона
                </div>
            </div>

            <div class="class-card" onclick="selectClass('mage', this)">
                <div class="class-title">Маг</div>
                <div class="class-desc">
                    75 HP<br>
                    Урон 5<br>
                    15% шанс оглушить врага
                </div>
            </div>

            <div class="class-card" onclick="selectClass('orc', this)">
                <div class="class-title">Орк</div>
                <div class="class-desc">
                    125 HP<br>
                    Урон 5–7<br>
                    Умение: Блок
                </div>
            </div>
        </div>

        <button class="btn" onclick="registerUser()">Зарегистрироваться</button>
        <div id="message" class="msg"></div>
        <div class="msg">Уже есть аккаунт? <a href="login.html">Войти</a></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
