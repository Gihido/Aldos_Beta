<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Регистрация</title>
<style>
:root{--a:#f09a45;--a2:#cf7531;--p:#4d4640;--t:#f8f2ea;--m:#d7c8b7}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Segoe UI,Arial;background:radial-gradient(circle at top,#62594f,#221f1b 70%);color:var(--t)}
.card{width:min(860px,94%);background:linear-gradient(180deg,#4d4640,#5d544c);border:1px solid #8c7f72;border-radius:22px;padding:22px;box-shadow:0 20px 40px rgba(0,0,0,.35);animation:up .45s ease}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.input{width:100%;padding:13px;border-radius:12px;border:1px solid #988779;background:#2f2a26;color:#fff;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.class-card{padding:12px;border-radius:14px;border:2px solid #8c7c6f;background:#3f3833;cursor:pointer}.class-card.active{border-color:var(--a);background:#5b4737}
.btn{width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--a2));font-weight:700;cursor:pointer}
.msg{margin-top:10px;color:var(--m)}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="card"><h1>Создание героя</h1><p class="msg">Выберите класс и начните путь</p>
<input id="username" class="input" placeholder="Логин"><input id="password" type="password" class="input" placeholder="Пароль">
<div class="grid">
<div class="class-card active" onclick="selectClass('archer',this)"><b>Лучник</b><div class="msg">85 HP, 5-10 урона, 10% крит</div></div>
<div class="class-card" onclick="selectClass('mage',this)"><b>Маг</b><div class="msg">75 HP, 5 урона, 15% оглушение</div></div>
<div class="class-card" onclick="selectClass('orc',this)"><b>Орк</b><div class="msg">125 HP, 5-7 урона, навык Блок</div></div>
</div>
<button class="btn" onclick="registerUser()">Зарегистрироваться</button>
<div id="message" class="msg"></div><div class="msg">Уже есть аккаунт? <a href="login.html" style="color:#ffd6ac">Войти</a></div>
</div><script src="app.js"></script></body></html>
